# [RSC-IRAN] PR CI for pull requests targeting iran/patches
name: PR CI

on:
  pull_request:
    branches: [iran/patches]
  workflow_dispatch:

concurrency:
  group: pr-ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create empty frontend dist (hatchling force-include)
        shell: bash
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep

      - name: Install backend dependencies
        run: pip install -e "./backend[dev]"

      - name: Run backend tests
        run: |
          pytest backend/tests/test_project_roles.py backend/tests/unit/test_restricted_mode.py backend/tests/unit/test_restricted_mode_allowlist.py backend/tests/unit/test_restricted_mode_enforcement.py -q

  frontend:
    name: Frontend Typecheck & Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline || npm install

      - name: Type check
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: npm run typecheck

      - name: Run targeted vitest
        run: npx vitest run src/app/layout/Sidebar.restricted.test.tsx
