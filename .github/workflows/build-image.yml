name: build-image
on:
  push:
    branches: [iran/patches]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  checks:
    name: Iran & Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Iran Regional Checks
        run: |
          npm run check:iran
          npm run check:fa

      - name: Run Python Iran Primitives Test
        run: |
          python -c "from app.core.jalali import format_jalali; print(format_jalali('2026-10-11'))"
          python -c "from app.core.digits import normalize_number_string; print(normalize_number_string('۱۲٬۳۴۵'))"
        working-directory: backend

      - name: Install Frontend Dependencies
        run: npm ci --prefer-offline || npm install
        working-directory: frontend

      - name: Run Frontend Money Unit Tests (Vitest)
        run: npx vitest run src/shared/lib/money.test.ts
        working-directory: frontend

  build:
    name: Build & Push Docker Image
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.unified
          push: true
          tags: |
            ghcr.io/alborz-a/oce:v18.5.0-ir.${{ github.run_number }}
            ghcr.io/alborz-a/oce:latest-ir
          cache-from: type=gha
          cache-to: type=gha,mode=max
