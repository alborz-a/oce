# portal.royalstars.co server block. New section lives at /mizito/; the old hand-built section stays at /colleagues (fallback).
location /mizito/ {
    proxy_pass http://127.0.0.1:18090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location /socket.io/ {            # Mizito client opens ws at origin root; OCE does not use this path
    proxy_pass http://127.0.0.1:18090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
}
