# portal.royalstars.co: http{} level (once, e.g. conf.d/mizito-gw-http.conf)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=mizito_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=mizito_up:10m  rate=2r/s;
limit_conn_zone $binary_remote_addr zone=mizito_ws:10m;

# portal.royalstars.co server block. New section lives at /_rs/; the old hand-built section stays at /colleagues (fallback).
# Body caps match the gateway (MAX_UPLOAD 25 MB + multipart overhead, MAX_API_BODY 2 MB).
location = /_rs { return 301 /_rs/; }
location /mizito/ {
    return 302 /_rs/;
}
location = /mizito/api/content/upload {
    client_max_body_size 26m;
    limit_req zone=mizito_up burst=6 nodelay;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:18090/api/content/upload;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
}
location /socket.io/ {            # Mizito client opens ws at origin root; OCE does not use this path
    limit_conn mizito_ws 10;      # idle unauthenticated sockets: cap per IP
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:18090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
}
